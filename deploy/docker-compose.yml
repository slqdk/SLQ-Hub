# SLQ Hub - every service on the VM. See docs/DESIGN.md (topology) and
# docs/INSTALL.md.
#
# Do not edit this file on the VM: updates are fast-forwards and refuse a
# changed clone. Machine settings and secrets live in /srv/slq-hub/.env;
# compose changes go in /srv/slq-hub/docker-compose.override.yml.
# Always run compose through the wrapper, which adds both:
#   bash update.sh compose ps | logs -f hub | restart llm | ...
name: slq-hub

x-gpu: &gpu
  # ROCm in a container: the KFD compute node and the render nodes, the
  # host's render group by number (the name may not exist in the image),
  # and seccomp off as AMD's container docs do.
  devices:
    - /dev/kfd
    - /dev/dri
  group_add:
    - video
    - "${RENDER_GID:?RENDER_GID is not set in .env}"
  security_opt:
    - seccomp=unconfined

services:
  hub:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: slq-hub-hub:latest
    container_name: slq-hub
    restart: unless-stopped
    env_file:
      - ${HUB_ROOT:-/srv/slq-hub}/.env
    environment:
      HUB_DATA_DIR: /data
      HUB_MODELS_DIR: /models
      HUB_LLM_URL: http://llm:9000
      HUB_LLM_HOST: llm
      HUB_COMFY_URL: http://comfyui:8188
      HUB_SEARXNG_URL: http://searxng:8080
      HUB_SANDBOX_URL: http://172.31.250.20:7000
      HUB_SANDBOX_IP: 172.31.250.20
      HUB_COMFY_FILES: /comfy
      HUB_SPEECH_URL: http://speech:7100
    ports:
      - "${HUB_PORT:-8080}:8080"          # web UI + API (Nginx Proxy Manager points here)
      - "${HUB_OLLAMA_PORT:-11434}:8080"  # the same app on Ollama's usual port
    volumes:
      - ${HUB_ROOT:-/srv/slq-hub}/data:/data
      - ${HUB_ROOT:-/srv/slq-hub}/models:/models
      # ComfyUI's picture folders: the Hub deletes the copies of people's pictures there after each answer
      - ${HUB_ROOT:-/srv/slq-hub}/comfy/input:/comfy/input
      - ${HUB_ROOT:-/srv/slq-hub}/comfy/output:/comfy/output
    networks:
      core: {}
      inner:
        ipv4_address: 172.31.251.10
      sbx:
        ipv4_address: 172.31.250.10
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/hub/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  llm:
    <<: *gpu
    build:
      context: ../services/llm
      args:
        LLAMA_IMAGE: ${LLAMA_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-rocm-b11783}
    image: slq-hub-llm:latest
    container_name: slq-hub-llm
    restart: unless-stopped
    environment:
      SUPERVISOR_TOKEN: ${HUB_INTERNAL_TOKEN:?HUB_INTERNAL_TOKEN is not set in .env}
      TZ: ${TZ:-Europe/Copenhagen}
    volumes:
      - ${HUB_ROOT:-/srv/slq-hub}/models/llm:/models/llm:ro
      - ${HUB_ROOT:-/srv/slq-hub}/data/logs/llm:/logs
    networks:
      inner:
        ipv4_address: 172.31.251.11

  comfyui:
    <<: *gpu
    build:
      context: ../services/comfyui
      args:
        COMFYUI_REF: ${COMFYUI_REF:-v0.42.3}
        TORCH_INDEX: ${TORCH_INDEX:-https://download.pytorch.org/whl/rocm7.14}
        TORCH_VERSION: ${TORCH_VERSION:-2.14.1}
        TORCHVISION_VERSION: ${TORCHVISION_VERSION:-0.29.1}
    image: slq-hub-comfyui:latest
    container_name: slq-hub-comfyui
    restart: unless-stopped
    shm_size: 8gb
    environment:
      COMFY_ARGS: ${COMFY_ARGS:-}
      TZ: ${TZ:-Europe/Copenhagen}
    volumes:
      - ${HUB_ROOT:-/srv/slq-hub}/models/comfy:/opt/ComfyUI/models
      - ${HUB_ROOT:-/srv/slq-hub}/comfy/input:/opt/ComfyUI/input
      - ${HUB_ROOT:-/srv/slq-hub}/comfy/output:/opt/ComfyUI/output
      - ${HUB_ROOT:-/srv/slq-hub}/comfy/user:/opt/ComfyUI/user
    ports:
      - "127.0.0.1:8188:8188"   # maintenance only: ssh -L 8188:127.0.0.1:8188 <vm>
    networks:
      inner:
        ipv4_address: 172.31.251.12

  # LoRA training (0.50.0): Ostris' ai-toolkit on the card, given jobs by the Hub when its GPU queue hands it the
  # whole card. Optional - on with COMPOSE_PROFILES=training in .env (a large image: PyTorch for ROCm and
  # ai-toolkit's libraries). Offline like the other model containers: the Hub fetches the base models into
  # models/hf (Hugging Face's cache), and the run's pictures and results live in data/training.
  trainer:
    <<: *gpu
    profiles: ["training"]
    build:
      context: ../services/trainer
      args:                     # its own PyTorch - ai-toolkit's AMD pins, not ComfyUI's (services/trainer/Dockerfile)
        TORCH_INDEX: ${TRAINER_TORCH_INDEX:-https://download.pytorch.org/whl/rocm7.1}
        TORCH_VERSION: ${TRAINER_TORCH_VERSION:-2.13.0}
        TORCHVISION_VERSION: ${TRAINER_TORCHVISION_VERSION:-0.28.0}
        TORCHAUDIO_VERSION: ${TRAINER_TORCHAUDIO_VERSION:-2.11.0}
        AI_TOOLKIT_REF: ${AI_TOOLKIT_REF:-b69b98314557f7c8b08e11bbb14e48d959e6ab26}
    image: slq-hub-trainer:latest
    container_name: slq-hub-trainer
    restart: unless-stopped
    init: true
    shm_size: 8gb
    environment:
      TZ: ${TZ:-Europe/Copenhagen}
      TRAINER_ALLOC_CONF: ${TRAINER_ALLOC_CONF:-}   # PyTorch's allocator for ai-toolkit (empty: its defaults)
    volumes:
      - ${HUB_ROOT:-/srv/slq-hub}/data/training:/training
      - ${HUB_ROOT:-/srv/slq-hub}/models/hf:/models/hf
      - ${HUB_ROOT:-/srv/slq-hub}/models/comfy/checkpoints:/models/comfy/checkpoints:ro   # SDXL bases (0.56.0)
    networks:
      inner:
        ipv4_address: 172.31.251.14

  # Text to speech on the CPU (Chatterbox, Røst): no GPU, so the chat model stays on the card while it speaks.
  speech:
    build:
      context: ../services/speech
    image: slq-hub-speech:latest
    container_name: slq-hub-speech
    restart: unless-stopped
    init: true
    environment:
      SPEECH_THREADS: ${SPEECH_THREADS:-}
      TZ: ${TZ:-Europe/Copenhagen}
    volumes:
      # all of models/, read-only: the Hub makes models/speech when it downloads the first voice model (a folder
      # Docker made for a mount of its own would belong to root, and the Hub could not write into it). The
      # service reads only files under /models/speech.
      - ${HUB_ROOT:-/srv/slq-hub}/models:/models:ro
    tmpfs:
      - /tmp:size=1g
    # No hard CPU cap (one above the VM's cores would stop the container from starting): the service uses all
    # cores but two, or SPEECH_THREADS, and under contention it yields to the Hub and the model containers.
    cpu_shares: 512
    mem_limit: ${SPEECH_MEM:-12g}
    networks:
      inner:
        ipv4_address: 172.31.251.13

  searxng:
    image: docker.io/searxng/searxng:${SEARXNG_TAG:-latest}
    container_name: slq-hub-searxng
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?SEARXNG_SECRET is not set in .env}
      SEARXNG_BASE_URL: http://searxng:8080/
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    networks: [core]

  sandbox:
    build:
      context: ../services/sandbox
    image: slq-hub-sandbox:latest
    container_name: slq-hub-sandbox
    restart: unless-stopped
    # An init as PID 1 collects the processes commands leave behind when they end (Wine's server and services
    # after every windows_app run, anything started in the background) - the sandbox daemon would not.
    init: true
    environment:
      EXECD_TOKEN: ${HUB_INTERNAL_TOKEN:?HUB_INTERNAL_TOKEN is not set in .env}
      TZ: ${TZ:-Europe/Copenhagen}
    volumes:
      - ${HUB_ROOT:-/srv/slq-hub}/data/workspace:/workspace
      - ${HUB_ROOT:-/srv/slq-hub}/data/sandbox-home:/home/sandbox
    tmpfs:
      - /tmp:size=4g
    # Public resolvers: Docker's embedded DNS forwards from inside this
    # network, and the firewall drops everything private - a LAN resolver
    # would not answer.
    dns: [1.1.1.1, 9.9.9.9]
    cpus: ${SANDBOX_CPUS:-6}
    mem_limit: ${SANDBOX_MEM:-8g}
    pids_limit: 2048
    networks:
      sbx:
        ipv4_address: 172.31.250.20

  # Windows in a VM inside a container (dockur/windows, on the VM's KVM - nested virtualisation on Proxmox), for
  # Windows-only tools the owner installs and lets the Hub use, such as an MCP server (0.39.0). Off unless .env has
  # COMPOSE_PROFILES=windows. It sits on the sandbox's network under the sandbox's firewall rules: the internet yes,
  # the LAN, the other containers and the VM no. The owner reaches it with RDP on the VM's address, the Hub at
  # 172.31.250.30. The first start downloads and installs Windows by itself (20-30 minutes).
  windows:
    image: docker.io/dockurr/windows:${WINDOWS_TAG:-latest}
    container_name: slq-hub-windows
    profiles: ["windows"]
    restart: unless-stopped
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    stop_grace_period: 2m                 # Windows shuts down properly on a stop
    environment:
      VERSION: ${WINDOWS_VERSION:-10l}
      RAM_SIZE: ${WINDOWS_RAM:-8G}
      CPU_CORES: ${WINDOWS_CORES:-4}
      DISK_SIZE: ${WINDOWS_DISK:-64G}
      USERNAME: ${WINDOWS_USER:-hub}
      PASSWORD: ${WINDOWS_PASSWORD:-}     # update.sh writes one into .env when the profile is on and it is missing
      LANGUAGE: ${WINDOWS_LANGUAGE:-English}
      REGION: ${WINDOWS_REGION:-da-DK}
      KEYBOARD: ${WINDOWS_KEYBOARD:-da-DK}
    ports:
      - "${WINDOWS_RDP_PORT:-3389}:3389/tcp"
      - "${WINDOWS_RDP_PORT:-3389}:3389/udp"
      - "127.0.0.1:8006:8006"             # the web viewer, for the installation: ssh -L 8006:127.0.0.1:8006 <vm>
    volumes:
      - ${HUB_ROOT:-/srv/slq-hub}/windows/storage:/storage     # its disk; not in the backups
      - ${HUB_ROOT:-/srv/slq-hub}/windows/oem:/oem             # copied to C:\OEM; an install.bat there runs at setup
      - ${HUB_ROOT:-/srv/slq-hub}/windows/shared:/shared       # the Shared folder (Z:) in Windows
    dns: [1.1.1.1, 9.9.9.9]               # as the sandbox: the firewall drops a LAN resolver
    networks:
      sbx:
        ipv4_address: 172.31.250.30

networks:
  # The Hub and SearXNG: both reach the internet (web pages, downloads, search engines).
  core: {}
  # The model containers (llm, comfyui, speech) and the Hub, which alone talks to them. They need nothing from
  # outside: the VM's firewall (deploy/firewall) drops new connections from their fixed addresses to anything
  # outside this network, so a model, a ComfyUI node or a library cannot reach the internet or the LAN.
  inner:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-slqinner
    ipam:
      config:
        - subnet: 172.31.251.0/24
  # The sandbox's own network. The VM's firewall (deploy/firewall) drops new
  # connections from the sandbox to the LAN, to the other containers and to
  # the VM itself; the internet stays open. Fixed addresses so the rules can
  # name them.
  sbx:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-slqsbx
    ipam:
      config:
        - subnet: 172.31.250.0/24
